<style>
        .monolith-text {
            text-shadow: 0 0 10px rgba(138, 235, 255, 0.8), 0 0 20px rgba(138, 235, 255, 0.4);
            animation: pulse-glow 4s infinite alternate ease-in-out;
        }

        .monolith-slab {
            box-shadow: inset 0 0 40px rgba(138, 235, 255, 0.1), 0 0 80px rgba(5, 11, 24, 0.8);
            border: 1px solid rgba(138, 235, 255, 0.2);
            backdrop-filter: blur(24px);
            background: linear-gradient(135deg, rgba(36, 43, 45, 0.4) 0%, rgba(9, 15, 17, 0.6) 100%);
            transform-style: preserve-3d;
            animation: float 10s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(2deg) rotateY(-2deg); }
            50% { transform: translateY(-20px) rotateX(-2deg) rotateY(2deg); }
        }

        @keyframes pulse-glow {
            0% { text-shadow: 0 0 5px rgba(138, 235, 255, 0.5), 0 0 10px rgba(138, 235, 255, 0.3); opacity: 0.8; }
            100% { text-shadow: 0 0 15px rgba(138, 235, 255, 1), 0 0 30px rgba(138, 235, 255, 0.6); opacity: 1; }
        }

        .star-field {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s infinite linear;
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes twinkle {
            0% { transform: translateY(0); opacity: 0.2; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-200px); opacity: 0.2; }
        }

        .aurora-bg {
            background: radial-gradient(circle at 50% 50%, rgba(138, 235, 255, 0.15) 0%, transparent 60%);
            filter: blur(60px);
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
