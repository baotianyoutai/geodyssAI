<!DOCTYPE html><html class="dark" lang="ja"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Stellar Chart - Seikai</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#0e1416",
                        "on-tertiary": "#002e6a",
                        "on-surface-variant": "#bbc9cd",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#001a42",
                        "on-background": "#dde4e5",
                        "surface-container-high": "#242b2d",
                        "outline-variant": "#3c494c",
                        "primary": "#8aebff",
                        "on-secondary-fixed-variant": "#5516be",
                        "constellation-dl": "#2DD4BF",
                        "tertiary-fixed-dim": "#adc6ff",
                        "secondary": "#d0bcff",
                        "on-surface": "#dde4e5",
                        "on-secondary-container": "#c4abff",
                        "secondary-fixed-dim": "#d0bcff",
                        "surface-container-highest": "#2f3638",
                        "on-tertiary-container": "#004ba5",
                        "on-secondary-fixed": "#23005c",
                        "munchkin-mint": "#BDE7DB",
                        "munchkin-lavender": "#C7BDF0",
                        "inverse-on-surface": "#2b3233",
                        "tertiary-fixed": "#d8e2ff",
                        "surface-variant": "#2f3638",
                        "outline": "#859397",
                        "surface-tint": "#2fd9f4",
                        "tertiary-container": "#a5c1ff",
                        "surface-dim": "#0e1416",
                        "munchkin-pink": "#F2B8CC",
                        "munchkin-cream": "#FFF3E4",
                        "deep": "#0B1026",
                        "inverse-primary": "#006877",
                        "mist": "#93A1BE",
                        "error": "#ffb4ab",
                        "inverse-surface": "#dde4e5",
                        "on-primary": "#00363e",
                        "surface-container-lowest": "#090f11",
                        "background": "#0e1416",
                        "primary-fixed": "#a2eeff",
                        "surface-container-low": "#161d1e",
                        "secondary-fixed": "#e9ddff",
                        "constellation-claude": "#E07B54",
                        "surface-bright": "#343a3c",
                        "starlight": "#EDF2FB",
                        "primary-container": "#22d3ee",
                        "error-container": "#93000a",
                        "constellation-firebase": "#F59E0B",
                        "on-secondary": "#3c0091",
                        "primary-fixed-dim": "#2fd9f4",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#005763",
                        "tertiary": "#d0ddff",
                        "void": "#050B18",
                        "secondary-container": "#571bc1",
                        "surface-container": "#1a2122",
                        "on-primary-fixed": "#001f25",
                        "on-tertiary-fixed-variant": "#004395",
                        "on-primary-fixed-variant": "#004e5a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "2rem",
                        "stack-md": "1rem",
                        "stack-sm": "0.5rem",
                        "margin-mobile": "1rem",
                        "gutter": "1.5rem",
                        "margin-desktop": "2rem"
                    },
                    "fontFamily": {
                        "display-lg": ["Space Grotesk"],
                        "code-sm": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "nav-label": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "headline-md": ["Space Grotesk"],
                        "display-lg-mobile": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "code-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "nav-label": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "700" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .noise-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        
        .abyssal-gradient {
            background: linear-gradient(180deg, rgba(5,11,24,0.9) 0%, rgba(5,11,24,0.98) 40%, #000000 100%);
        }

        .star-glow {
            box-shadow: 0 0 24px rgba(138, 235, 255, 0.4);
        }
        
        .depth-line {
            background: linear-gradient(180deg, rgba(138,235,255,0.8) 0%, rgba(138,235,255,0) 100%);
        }

        @keyframes descend {
            0% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(10px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.5; }
        }
        .animate-descend {
            animation: descend 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-void text-on-background min-h-screen relative overflow-hidden font-body-md">
<!-- Background layers -->
<div class="absolute inset-0 z-0 abyssal-gradient"></div>
<div class="absolute inset-0 z-0 noise-bg mix-blend-overlay"></div>
<!-- Cinematic 3D Canvas Placeholder (Simulated depth) -->
<div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
<div class="relative w-full h-full perspective-[1000px]">
<!-- Deep Layer (Midnight) -->
<div class="absolute top-[30%] left-[60%] w-1 h-1 bg-secondary rounded-full shadow-[0_0_8px_rgba(208,188,255,0.8)] opacity-60 transform translate-z-[-500px]"></div>
<div class="absolute top-[70%] left-[20%] w-1.5 h-1.5 bg-munchkin-mint rounded-full shadow-[0_0_12px_rgba(189,231,219,0.7)] opacity-50 transform translate-z-[-400px]"></div>
<div class="absolute top-[40%] left-[80%] w-0.5 h-0.5 bg-primary rounded-full shadow-[0_0_4px_rgba(138,235,255,0.9)] opacity-40 transform translate-z-[-800px]"></div>
<!-- Mid Layer (Twilight) -->
<div class="absolute top-[50%] left-[30%] w-3 h-3 bg-tertiary-container rounded-full shadow-[0_0_16px_rgba(165,193,255,0.6)] opacity-80 transform translate-z-[-200px]"></div>
<div class="absolute top-[20%] left-[70%] w-2 h-2 bg-constellation-dl rounded-full shadow-[0_0_12px_rgba(45,212,191,0.7)] opacity-70 transform translate-z-[-100px]"></div>
<!-- Surface Layer (Azure) -->
<div class="absolute top-[60%] left-[45%] w-6 h-6 bg-primary rounded-full star-glow opacity-100 transform translate-z-[0]"></div>
<div class="absolute top-[35%] left-[15%] w-4 h-4 bg-primary rounded-full shadow-[0_0_20px_rgba(138,235,255,0.5)] opacity-90 transform translate-z-[50px]"></div>
</div>
</div>
<!-- Main UI Container -->
<div class="relative z-10 w-full h-screen flex flex-col justify-between p-margin-mobile md:p-margin-desktop">
<!-- Header -->
<header class="flex justify-between items-center w-full max-w-screen-2xl mx-auto">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter">星海 Seikai</h1>
<div class="flex items-center gap-stack-md bg-surface-container/60 backdrop-blur-md rounded-full px-4 py-2 border border-outline-variant/30 shadow-[0_4px_16px_rgba(3,7,24,0.4)]">
<span class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors cursor-pointer" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</div>
</header>
<!-- Center Content (Viewport focus) -->
<main class="flex-grow flex flex-col justify-center items-center pointer-events-none mt-20">
<!-- Decorative focal point for the main 'star' -->
<div class="w-64 h-64 border border-primary/20 rounded-full flex items-center justify-center relative">
<div class="w-48 h-48 border border-primary/10 rounded-full animate-[spin_60s_linear_infinite] absolute"></div>
<div class="w-32 h-32 border border-primary/5 rounded-full animate-[spin_40s_linear_reverse_infinite] absolute"></div>
</div>
</main>
<!-- Footer / HUD Area -->
<footer class="w-full max-w-screen-2xl mx-auto flex flex-col md:flex-row justify-between items-end gap-stack-lg">
<!-- Left: Legend -->
<div class="bg-surface-container/40 backdrop-blur-lg border border-outline-variant/20 rounded-xl p-4 shadow-[0_8px_32px_0_rgba(3,7,24,0.6)] flex flex-col gap-2">
<h3 class="font-code-sm text-code-sm text-on-surface-variant uppercase tracking-widest mb-1 opacity-70">Stratification</h3>
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(138,235,255,0.8)]"></div>
<span class="font-nav-label text-nav-label text-on-surface">Azure (Surface)</span>
</div>
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-tertiary-container shadow-[0_0_8px_rgba(165,193,255,0.5)]"></div>
<span class="font-nav-label text-nav-label text-on-surface opacity-80">Twilight (Mid)</span>
</div>
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_rgba(208,188,255,0.3)]"></div>
<span class="font-nav-label text-nav-label text-on-surface opacity-60">Midnight (Deep)</span>
</div>
</div>
<!-- Center: Descend Action -->
<div class="flex flex-col items-center gap-2 cursor-pointer group pointer-events-auto">
<span class="font-code-sm text-code-sm text-primary tracking-[0.2em] uppercase group-hover:text-primary-fixed transition-colors">Descend</span>
<span class="material-symbols-outlined text-primary animate-descend group-hover:text-primary-fixed transition-colors" style="font-variation-settings: 'FILL' 0;">keyboard_double_arrow_down</span>
</div>
<!-- Right: Depth Indicator -->
<div class="flex items-center gap-4 bg-surface-container/20 backdrop-blur-md rounded-lg p-3 border border-outline-variant/10">
<div class="flex flex-col items-end">
<span class="font-code-sm text-code-sm text-on-surface-variant opacity-70 uppercase tracking-wider">Depth</span>
<span class="font-headline-md text-headline-md text-primary font-bold">2,400m</span>
<span class="font-nav-label text-nav-label text-on-surface-variant mt-1">Abyssal Layer</span>
</div>
<div class="h-16 w-0.5 depth-line rounded-full relative">
<div class="absolute top-[60%] left-1/2 -translate-x-1/2 w-2 h-2 bg-primary rounded-full shadow-[0_0_10px_rgba(138,235,255,0.8)]"></div>
</div>
</div>
</footer>
</div>
</body></html>
