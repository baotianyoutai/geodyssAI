<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Stellar Bookmark - GeodyssAI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
        }
        
        /* Custom Animations */
        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }
        
        @keyframes float-stardust {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            50% { transform: translateY(-20px) translateX(10px); opacity: 0.8; }
        }

        .pulse-core {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .pulse-ring-delayed {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 1s;
        }

        /* Film Grain Overlay */
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>

<body class="bg-void text-on-surface font-body-md min-h-screen relative overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Cinematic Film Grain Overlay -->
<div class="film-grain"></div>
<!-- Background Space Environment -->
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-surface-container-low via-void to-void opacity-80"></div>
<!-- Decorative Stardust / Background Stars -->
<div class="absolute top-[20%] left-[15%] w-1 h-1 bg-white rounded-full opacity-40 blur-[1px]"></div>
<div class="absolute top-[60%] left-[80%] w-2 h-2 bg-primary-fixed-dim rounded-full opacity-60 blur-[2px] animate-pulse"></div>
<div class="absolute top-[80%] left-[30%] w-1 h-1 bg-white rounded-full opacity-30 blur-[1px]"></div>
<div class="absolute top-[10%] left-[70%] w-1.5 h-1.5 bg-constellation-claude rounded-full opacity-50 blur-[1px]"></div>
<!-- Main 3D Canvas Area (Simulated) -->
<main class="relative w-full h-screen flex items-center justify-center z-10">
<!-- Center Bookmarked Star Node -->
<div class="relative flex items-center justify-center">
<!-- Pulsing Rings (Cyan #22D3EE) -->
<div class="absolute w-32 h-32 rounded-full border-2 border-primary-container pulse-core z-0"></div>
<div class="absolute w-32 h-32 rounded-full border border-primary-container opacity-50 pulse-ring-delayed z-0"></div>
<!-- Subtle Outer Glow -->
<div class="absolute w-48 h-48 rounded-full bg-primary-container/20 blur-3xl z-0"></div>
<!-- The Star Itself -->
<div class="relative w-16 h-16 rounded-full bg-gradient-to-tr from-surface to-primary-container border border-primary-container/50 shadow-[0_0_40px_rgba(34,211,238,0.4)] z-10 flex items-center justify-center overflow-hidden">
<!-- Star Surface Texture (Simulated) -->
<div class="absolute inset-0 opacity-30 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent blur-[2px]"></div>
</div>
<!-- Bookmark Icon Attached to Star -->
<div class="absolute -top-4 -right-4 w-8 h-8 bg-surface/80 backdrop-blur-md rounded-full border border-outline-variant/50 flex items-center justify-center shadow-[0_0_15px_rgba(3,7,24,0.8)] z-20 group cursor-pointer hover:border-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-primary-container text-[16px] group-hover:scale-110 transition-transform duration-200" data-icon="bookmark" data-weight="fill">bookmark</span>
</div>
<!-- Contextual Card / Tooltip (Glassmorphism) -->
<div class="absolute top-24 w-64 p-4 bg-surface-container-low/80 backdrop-blur-xl border border-outline-variant/20 rounded-xl shadow-[0_0_30px_rgba(3,7,24,0.8)] z-30 opacity-0 animate-[fadeIn_0.5s_ease-out_1s_forwards]">
<div class="flex items-start justify-between mb-2">
<span class="font-nav-label text-nav-label text-primary-fixed tracking-wider uppercase">Saved Node</span>
<div class="w-2 h-2 rounded-full bg-primary-container shadow-[0_0_10px_rgba(34,211,238,0.8)]"></div>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2 leading-tight">Navigating the Semantic Void</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-2">A deep dive into 3D conceptual mapping and how AI models interpret vast oceans of interconnected data points.</p>
<div class="mt-4 flex gap-2">
<span class="px-2 py-1 rounded-full border border-constellation-dl/30 bg-constellation-dl/10 font-nav-label text-[10px] text-constellation-dl">Deep Learning</span>
</div>
</div>
</div>
</main>
<!-- Top Navigation (Shell) -->
<nav class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-surface/60 backdrop-blur-md border-b border-outline-variant/16 shadow-[0_0_20px_rgba(3,7,24,0.6)] hidden md:flex">
<!-- Brand -->
<div class="font-display-lg text-primary tracking-tighter text-2xl">
            geodyssAI
        </div>
<!-- Links -->
<div class="flex space-x-8">
<a class="text-on-surface-variant font-nav-label text-nav-label hover:text-primary-fixed-dim transition-colors" href="#">Stellar Chart</a>

<span class="material-symbols-outlined" data-icon="explore">explore</span>
</button>
<button class="px-4 py-2 bg-gradient-to-r from-secondary-container to-primary-container text-on-primary-container rounded-lg font-nav-label text-nav-label hover:opacity-90 transition-opacity shadow-[0_0_15px_rgba(34,211,238,0.2)]">
                Boarding

<!-- Bottom Navigation (Mobile Shell) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 md:hidden px-4 bg-surface-container-highest/40 backdrop-blur-lg rounded-t-xl border-t border-outline-variant/20 shadow-[0_-4px_12px_rgba(3,7,24,0.5)]">

<span class="font-nav-label text-[10px]">Profile</span>

</nav>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

</body></html>
