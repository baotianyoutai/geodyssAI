<canvas id="shader-canvas-ANIMATION_9" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_9');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

// Simplex 2D noise
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 a0 = x - floor(x + 0.5);
  vec3 g = a0 * vec3(x0.x,x12.xz) + h * vec3(x0.y,x12.yw);
  vec3 l = 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 diff = m * g * l;
  return 130.0 * dot(diff, vec3(1.0));
}

void main() {
    vec2 uv = v_texCoord;
    vec2 p = uv * 2.0 - 1.0;
    p.x *= u_resolution.x / u_resolution.y;

    // Layered noise for more complexity
    float n = snoise(uv * 2.5 + u_time * 0.05);
    n += 0.5 * snoise(uv * 5.0 - u_time * 0.03);
    n += 0.25 * snoise(uv * 10.0 + u_time * 0.08);

    // Deep space colors
    vec3 voidColor = vec3(0.02, 0.04, 0.09); // #050B18
    vec3 deepColor = vec3(0.04, 0.06, 0.15); // #0B1026
    vec3 nebulaColor1 = vec3(0.55, 0.36, 0.96); // #8B5CF6 (Violet)
    vec3 nebulaColor2 = vec3(0.95, 0.72, 0.80); // #F2B8CC (Munchkin Pink)
    vec3 cyanColor = vec3(0.13, 0.83, 0.93);   // #22D3EE (Stellar Cyan)

    vec3 color = mix(voidColor, deepColor, uv.y + 0.2 * n);
    
    // Nebula clouds
    float nebula1 = smoothstep(0.1, 0.9, n);
    color = mix(color, nebulaColor1, nebula1 * 0.15);
    
    float nebula2 = smoothstep(0.4, 1.0, snoise(uv * 1.5 - u_time * 0.02));
    color = mix(color, nebulaColor2, nebula2 * 0.1);

    // Aurora-like shimmering light
    float aurora = smoothstep(0.3, 0.7, snoise(vec2(uv.x * 0.5, uv.y * 1.5 + u_time * 0.1)));
    color = mix(color, cyanColor, aurora * 0.08);
    
    // Add fine grain / shimmer
    float shimmer = fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453);
    color += shimmer * 0.015;

    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<div class="absolute inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_10" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_10');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container'); // This ID will be injected by the renderer
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // High-density Star particles
  const starCount = 8000;
  const starGeometry = new THREE.BufferGeometry();
  const starPositions = new Float32Array(starCount * 3);
  const starSizes = new Float32Array(starCount);
  const starPhases = new Float32Array(starCount);

  for (let i = 0; i < starCount; i++) {
    const r = 15 + Math.random() * 50;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    
    starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    starPositions[i * 3 + 2] = r * Math.cos(phi);
    
    starSizes[i] = 0.5 + Math.random() * 2.5;
    starPhases[i] = Math.random() * Math.PI * 2;
  }

  starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  starGeometry.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

  // Custom ShaderMaterial for Twinkling Stars
  const starMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(0xEDF2FB) }
    },
    vertexShader: `
      attribute float size;
      varying float vAlpha;
      uniform float uTime;
      void main() {
        vAlpha = 0.5 + 0.5 * sin(uTime * 2.0 + position.x * 0.1 + position.y * 0.1);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (300.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying float vAlpha;
      uniform vec3 uColor;
      void main() {
        float d = distance(gl_PointCoord, vec2(0.5));
        if (d > 0.5) discard;
        float strength = 1.0 - (d / 0.5);
        gl_FragColor = vec4(uColor, strength * vAlpha);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);

  // Interactive Nebula Group
  const nebulaGroup = new THREE.Group();
  const nebulaColors = [0x8B5CF6, 0xF2B8CC, 0x22D3EE];
  for(let i = 0; i < 12; i++) {
    const geo = new THREE.SphereGeometry(8 + Math.random() * 12, 16, 16);
    const mat = new THREE.MeshBasicMaterial({
      color: nebulaColors[i % 3],
      transparent: true,
      opacity: 0.03,
      side: THREE.BackSide
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 60,
      (Math.random() - 0.5) * 60,
      (Math.random() - 0.5) * 60
    );
    nebulaGroup.add(mesh);
  }
  scene.add(nebulaGroup);

  camera.position.z = 40;

  function animate(t) {
    requestAnimationFrame(animate);
    
    const time = t * 0.001;
    starMaterial.uniforms.uTime.value = time;
    
    stars.rotation.y += 0.0003;
    stars.rotation.x += 0.0001;
    
    nebulaGroup.children.forEach((child, i) => {
      child.position.y += Math.sin(time * 0.5 + i) * 0.01;
      child.scale.setScalar(1 + Math.sin(time * 0.3 + i) * 0.08);
      child.rotation.z += 0.001;
    });

    renderer.render(scene, camera);
  }

  animate(0);

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();
})();
</script>
