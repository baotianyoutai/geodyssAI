<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_10 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_10" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_10');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container'); // This ID will be injected by the renderer
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // High-density Star particles
  const starCount = 8000;
  const starGeometry = new THREE.BufferGeometry();
  const starPositions = new Float32Array(starCount * 3);
  const starSizes = new Float32Array(starCount);
  const starPhases = new Float32Array(starCount);

  for (let i = 0; i < starCount; i++) {
    const r = 15 + Math.random() * 50;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    
    starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    starPositions[i * 3 + 2] = r * Math.cos(phi);
    
    starSizes[i] = 0.5 + Math.random() * 2.5;
    starPhases[i] = Math.random() * Math.PI * 2;
  }

  starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  starGeometry.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

  // Custom ShaderMaterial for Twinkling Stars
  const starMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(0xEDF2FB) }
    },
    vertexShader: `
      attribute float size;
      varying float vAlpha;
      uniform float uTime;
      void main() {
        vAlpha = 0.5 + 0.5 * sin(uTime * 2.0 + position.x * 0.1 + position.y * 0.1);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (300.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying float vAlpha;
      uniform vec3 uColor;
      void main() {
        float d = distance(gl_PointCoord, vec2(0.5));
        if (d > 0.5) discard;
        float strength = 1.0 - (d / 0.5);
        gl_FragColor = vec4(uColor, strength * vAlpha);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);

  // Interactive Nebula Group
  const nebulaGroup = new THREE.Group();
  const nebulaColors = [0x8B5CF6, 0xF2B8CC, 0x22D3EE];
  for(let i = 0; i < 12; i++) {
    const geo = new THREE.SphereGeometry(8 + Math.random() * 12, 16, 16);
    const mat = new THREE.MeshBasicMaterial({
      color: nebulaColors[i % 3],
      transparent: true,
      opacity: 0.03,
      side: THREE.BackSide
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 60,
      (Math.random() - 0.5) * 60,
      (Math.random() - 0.5) * 60
    );
    nebulaGroup.add(mesh);
  }
  scene.add(nebulaGroup);

  camera.position.z = 40;

  function animate(t) {
    requestAnimationFrame(animate);
    
    const time = t * 0.001;
    starMaterial.uniforms.uTime.value = time;
    
    stars.rotation.y += 0.0003;
    stars.rotation.x += 0.0001;
    
    nebulaGroup.children.forEach((child, i) => {
      child.position.y += Math.sin(time * 0.5 + i) * 0.01;
      child.scale.setScalar(1 + Math.sin(time * 0.3 + i) * 0.08);
      child.rotation.z += 0.001;
    });

    renderer.render(scene, camera);
  }

  animate(0);

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_10 -->


</body></html>
