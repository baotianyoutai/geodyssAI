<style>
        body {
            background-color: theme('colors.void');
            color: theme('colors.on-surface');
            position: relative;
            overflow: hidden; /* Hide scrollbars for the immersive view */
        }

        /* Film Grain Noise Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 10;
        }

        /* Ambient Nebula Glows */
        .nebula-glow-1 {
            position: absolute;
            top: -20%; left: -10%;
            width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.08) 0%, rgba(5, 11, 24, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            pointer-events: none;
        }
        
        .nebula-glow-2 {
            position: absolute;
            bottom: -30%; right: -20%;
            width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(199, 189, 240, 0.05) 0%, rgba(5, 11, 24, 0) 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }

        /* 3D Space Elements Simulation (CSS Fallback for visual representation) */
        .stellar-node {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
        }
        .stellar-node:hover {
            transform: translate(-50%, -50%) scale(1.2);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.8);
        }
        .node-mine {
            background-color: theme('colors.primary-container');
            width: 12px; height: 12px;
        }
        .node-shared-hint {
            background-color: theme('colors.munchkin-lavender');
            width: 6px; height: 6px;
            opacity: 0.7;
            box-shadow: 0 0 10px rgba(199, 189, 240, 0.6);
            animation: pulse-hint 2s infinite alternate;
        }
        
        @keyframes pulse-hint {
            0% { opacity: 0.4; box-shadow: 0 0 5px rgba(199, 189, 240, 0.3); }
            100% { opacity: 0.9; box-shadow: 0 0 15px rgba(199, 189, 240, 0.8); }
        }

        /* Paths */
        .path-line {
            position: absolute;
            transform-origin: 0 50%;
            z-index: 0;
        }
        .path-mine {
            height: 2px;
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.6) 0%, rgba(34, 211, 238, 0) 100%);
        }
        .path-shared {
            height: 1px;
            background: linear-gradient(90deg, rgba(199, 189, 240, 0.4) 0%, rgba(199, 189, 240, 0.1) 100%);
            border-bottom: 1px dashed rgba(199, 189, 240, 0.3);
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background-color: theme('colors.surface-container-low/60');
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid theme('colors.outline-variant/16');
            box-shadow: 0 0 20px rgba(3, 7, 24, 0.6);
        }

        .sync-pulse {
            animation: sync-fade 1.5s ease-in-out infinite alternate;
        }
        @keyframes sync-fade {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
    </style>
</head>
